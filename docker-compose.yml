networks:
  default:
    name: gym-tracker-net
    external: true

services:
  backend:
    build:
      context: .
    container_name: gym-tracker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-gym-tracker-backend}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-prod}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://gym-tracker-otel-collector:4318/v1/traces}
      OTEL_EXPORTER_TIMEOUT_SECONDS: ${OTEL_EXPORTER_TIMEOUT_SECONDS:-10}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      PYROSCOPE_ENABLED: ${PYROSCOPE_ENABLED:-true}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://gym-tracker-pyroscope:4040}
      PYROSCOPE_APPLICATION_NAME: ${PYROSCOPE_APPLICATION_NAME:-gym-tracker-backend}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_GIL_ONLY: ${PYROSCOPE_GIL_ONLY:-true}
      PYROSCOPE_ENABLE_LOGGING: ${PYROSCOPE_ENABLE_LOGGING:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOGS_DIR: ${LOGS_DIR:-app/logs}
      LOG_FILE_NAME: ${LOG_FILE_NAME:-backend.log}
    ports:
      - "8000:8000"
    volumes:
      - ./app/uploads:/app/app/uploads
      - ./app/logs:/app/app/logs