server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gym-tracker-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-logs
          service: gym-tracker-backend
          __path__: /var/log/gym-tracker/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            trace_id: trace_id
            span_id: span_id
            method: method
            path: path
            status_code: status_code
      - labels:
          level:
          logger:
          method:
          path:
          status_code:

