global:
  resolve_timeout: 5m
  smtp_smarthost: "${ALERTMANAGER_SMARTHOST}"
  smtp_from: "${ALERTMANAGER_EMAIL_FROM}"
  smtp_auth_username: "${ALERTMANAGER_AUTH_USERNAME}"
  smtp_auth_password: "${ALERTMANAGER_AUTH_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: gmail-email
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: gmail-email
    email_configs:
      - to: "${ALERTMANAGER_EMAIL_TO}"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, job]



