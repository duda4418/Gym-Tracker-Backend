name: Deploy backend to Lambda

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: "${{ vars.AWS_REGION || 'eu-central-1' }}"
  AWS_ROLE_ARN: "${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::606008290381:role/gym-tracker-backend-gha-role' }}"
  LAMBDA_FUNCTION_NAME: "${{ vars.LAMBDA_FUNCTION_NAME || 'gym-tracker-prod-backend' }}"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-lambda.txt
            requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment settings
        env:
          NEON_DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          NEON_POOLED_DATABASE_URL: ${{ secrets.NEON_POOLED_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_DIRECT_DATABASE_URL" || { echo "Missing NEON_DIRECT_DATABASE_URL secret" >&2; exit 1; }
          test -n "$NEON_POOLED_DATABASE_URL" || { echo "Missing NEON_POOLED_DATABASE_URL secret" >&2; exit 1; }
          test -n "$JWT_SECRET_KEY" || { echo "Missing JWT_SECRET_KEY secret" >&2; exit 1; }

      - name: Apply schema and seed catalog
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          LOG_TO_FILE: "false"
          METRICS_ENABLED: "false"
          OTEL_ENABLED: "false"
          PYROSCOPE_ENABLED: "false"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            alembic \
            sqlalchemy \
            "psycopg[binary]" \
            pydantic-settings
          python -m alembic upgrade head
          python -m app.scripts.seed_upload_data

      - name: Build Lambda ZIP
        run: bash scripts/build_lambda_package.sh

      - name: Deploy Lambda code
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://build/lambda/lambda.zip \
            --no-cli-pager
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Configure Lambda runtime
        env:
          NEON_POOLED_DATABASE_URL: ${{ secrets.NEON_POOLED_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          CORS_ORIGINS: "${{ vars.CORS_ORIGINS || 'http://localhost:3000' }}"
          CORS_ORIGIN_REGEX: "${{ vars.CORS_ORIGIN_REGEX || 'https://.*\\.vercel\\.app' }}"
          ASSET_BASE_URL: "${{ vars.ASSET_BASE_URL || '' }}"
        run: |
          set -euo pipefail
          jq -n \
            --arg database_url "$NEON_POOLED_DATABASE_URL" \
            --arg jwt_secret_key "$JWT_SECRET_KEY" \
            --arg cors_origins "$CORS_ORIGINS" \
            --arg cors_origin_regex "$CORS_ORIGIN_REGEX" \
            --arg asset_base_url "$ASSET_BASE_URL" \
            '{Variables: {
              DATABASE_URL: $database_url,
              POSTGRES_CONNECT_TIMEOUT_SECONDS: "5",
              POSTGRES_POOL_TIMEOUT_SECONDS: "5",
              DATABASE_POOL_SIZE: "1",
              DATABASE_MAX_OVERFLOW: "0",
              DATABASE_POOL_RECYCLE_SECONDS: "300",
              JWT_SECRET_KEY: $jwt_secret_key,
              JWT_ALGORITHM: "HS256",
              JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "20160",
              JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7",
              CORS_ORIGINS: $cors_origins,
              CORS_ORIGIN_REGEX: $cors_origin_regex,
              ASSET_BASE_URL: $asset_base_url,
              SERVE_LOCAL_UPLOADS: "false",
              LOG_TO_FILE: "false",
              METRICS_ENABLED: "false",
              OTEL_ENABLED: "false",
              PYROSCOPE_ENABLED: "false"
            }}' > /tmp/lambda-environment.json

          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --environment file:///tmp/lambda-environment.json \
            --no-cli-pager
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Verify Function URL
        run: |
          set -euo pipefail
          function_url=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query FunctionUrl \
            --output text)
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$function_url"
