groups:
  - name: gym-tracker-backend
    rules:
      - alert: BackendDown
        expr: up{job="gym-tracker-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Gym Tracker backend is down
          description: Prometheus has been unable to scrape the backend for more than 1 minute.

      - alert: High5xxRate
        expr: sum(rate(http_requests_total{job="gym-tracker-backend",status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated 5xx error rate
          description: The backend is returning more than 0.1 server errors per second over the last 5 minutes.

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="gym-tracker-backend"}[5m]))) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend p95 latency is high
          description: The backend p95 latency has stayed above 750ms for 10 minutes.

